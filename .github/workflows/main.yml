name: Build Unsigned iOS IPA (OpenMinis Arabic)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      APP_NAME: Minis

    steps:
      - name: 📥 Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 🛠️ Install build dependencies
        run: |
          brew install ninja llvm lld libarchive pkg-config meson
          echo "/opt/homebrew/opt/llvm/bin" >> $GITHUB_PATH
          echo "/opt/homebrew/opt/lld/bin" >> $GITHUB_PATH
          echo "/opt/homebrew/opt/libarchive/bin" >> $GITHUB_PATH

      - name: ⚙️ Copy build config templates
        run: |
          cp src/ios/Configs/ProviderCustomization.xcconfig.example \
             src/ios/Configs/ProviderCustomization.xcconfig || true

      - name: 🔨 Build LAME
        run: ./deps/build_lame.sh

      - name: 🔨 Build FFmpeg
        run: ./deps/build_ffmpeg.sh

      - name: 🔨 Build iSH kernel
        run: ./deps/build_ish.sh

      - name: 📦 Prepare Alpine rootfs
        run: ./deps/prepare_alpine_rootfs.sh

      - name: 🏗️ Build iOS app (NO SIGNING)
        run: |
          cd src/ios

          # Find the xcodeproj
          XCODEPROJ=$(find . -name "*.xcodeproj" -maxdepth 1 | head -1)
          SCHEME=$(xcodebuild -project "$XCODEPROJ" -list 2>/dev/null | grep -A1 'Schemes:' | tail -1 | tr -d ' ')

          echo "📦 Project: $XCODEPROJ"
          echo "📦 Scheme: $SCHEME"

          # Disable code signing in project
          sed -i '' 's/CODE_SIGNING_ALLOWED = YES/CODE_SIGNING_ALLOWED = NO/g' "$XCODEPROJ/project.pbxproj"
          sed -i '' 's/CODE_SIGNING_REQUIRED = YES/CODE_SIGNING_REQUIRED = NO/g' "$XCODEPROJ/project.pbxproj"
          sed -i '' 's/CODE_SIGN_IDENTITY = "iPhone Developer"/CODE_SIGN_IDENTITY = ""/g' "$XCODEPROJ/project.pbxproj"
          sed -i '' 's/CODE_SIGN_IDENTITY = iPhone Developer/CODE_SIGN_IDENTITY = ""/g' "$XCODEPROJ/project.pbxproj"

          # Build without signing
          xcodebuild build \
            -project "$XCODEPROJ" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build_output \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE="" \
            || {
              echo "❌ Build failed. Last 50 lines:"
              cat build_output/../Logs/Build/*.xcactivitylog 2>/dev/null | tail -50 || true
              exit 1
            }

      - name: 📦 Create unsigned IPA
        run: |
          cd src/ios
          APP_PATH=$(find build_output -name "*.app" -type d | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "❌ App not found. Searching build_output:"
            find build_output -type d -name "*.app" 2>/dev/null || true
            find build_output -maxdepth 4 -type d 2>/dev/null | head -30
            exit 1
          fi

          echo "✅ Found app at: $APP_PATH"

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r "${APP_NAME}-Arabic-unsigned.ipa" Payload

          echo "✅ IPA created: $(pwd)/${APP_NAME}-Arabic-unsigned.ipa"
          ls -lh *.ipa

      - name: ⬆️ Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenMinis-Arabic-unsigned-IPA
          path: src/ios/*.ipa
          retention-days: 30
