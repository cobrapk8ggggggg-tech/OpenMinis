name: Build Unsigned iOS IPA (OpenMinis Arabic)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      APP_NAME: Minis
      IOS_DIR: src/ios
      ARCHIVE_PATH: src/ios/build_output/Minis.xcarchive

    steps:
      - name: 📥 Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 🛠️ Install build dependencies
        run: |
          brew install ninja llvm lld libarchive pkg-config meson
          echo "/opt/homebrew/opt/llvm/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/opt/lld/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/opt/libarchive/bin" >> "$GITHUB_PATH"

      - name: ⚙️ Copy build config templates
        run: |
          cp src/ios/Configs/ProviderCustomization.xcconfig.example \
             src/ios/Configs/ProviderCustomization.xcconfig

      - name: 🔨 Build LAME
        run: ./deps/build_lame.sh

      - name: 🔨 Build FFmpeg
        run: ./deps/build_ffmpeg.sh

      - name: 🔨 Build iSH kernel
        run: ./deps/build_ish.sh

      - name: 📦 Prepare Alpine rootfs
        run: ./deps/prepare_alpine_rootfs.sh

      - name: 🏗️ Archive iOS app (NO SIGNING)
        run: |
          set -euo pipefail
          cd "$IOS_DIR"

          XCODEPROJ=$(find . -maxdepth 1 -name "*.xcodeproj" | head -n 1)
          if [ -z "$XCODEPROJ" ]; then
            echo "❌ No .xcodeproj found in $(pwd)"
            exit 1
          fi

          SCHEME=$(xcodebuild -project "$XCODEPROJ" -list 2>/dev/null \
            | awk '/Schemes:/{getline; gsub(/^[[:space:]]+|[[:space:]]+$/, ""); print; exit}')
          if [ -z "$SCHEME" ]; then
            echo "❌ Could not determine Xcode scheme"
            xcodebuild -project "$XCODEPROJ" -list
            exit 1
          fi

          echo "📦 Project: $XCODEPROJ"
          echo "📦 Scheme: $SCHEME"

          rm -rf build_output Payload "${APP_NAME}-Arabic-unsigned.ipa"

          # Archive instead of plain build so Xcode produces the same app-bundle
          # layout used for device distribution, including embedded app extensions,
          # SwiftSupport metadata, frameworks, and resources. Code signing remains
          # disabled so the resulting .ipa can be signed later by a separate tool.
          xcodebuild archive \
            -project "$XCODEPROJ" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "build_output/Minis.xcarchive" \
            -derivedDataPath build_output \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: 🔎 Validate unsigned app bundle
        run: |
          set -euo pipefail
          APP_PATH="$ARCHIVE_PATH/Products/Applications/${APP_NAME}.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "❌ App not found at expected archive path: $APP_PATH"
            find "$ARCHIVE_PATH" -maxdepth 5 -type d -name "*.app" -print 2>/dev/null || true
            exit 1
          fi

          test -x "$APP_PATH/$APP_NAME" || { echo "❌ Main executable missing or not executable"; exit 1; }
          test -f "$APP_PATH/alpine-rootfs.zip" || { echo "❌ alpine-rootfs.zip missing from app resources"; exit 1; }
          test -d "$APP_PATH/default_mount" || { echo "❌ default_mount missing from app resources"; exit 1; }
          test -d "$APP_PATH/Frameworks" || { echo "❌ Frameworks directory missing"; exit 1; }

          echo "✅ Unsigned app bundle looks complete: $APP_PATH"
          find "$APP_PATH" -maxdepth 2 \( -name "*.framework" -o -name "*.appex" -o -name "alpine-rootfs.zip" -o -name "default_mount" \) -print | sort

      - name: 📦 Create unsigned IPA
        run: |
          set -euo pipefail
          cd "$IOS_DIR"
          APP_PATH="build_output/Minis.xcarchive/Products/Applications/${APP_NAME}.app"

          # Ensure no stale signatures/profiles from local project settings survive.
          find "$APP_PATH" -name "_CodeSignature" -type d -prune -exec rm -rf {} +
          find "$APP_PATH" -name "embedded.mobileprovision" -type f -delete

          # Sideload signers commonly use personal/developer certificates that
          # cannot grant the App Group entitlement required by the embedded
          # Share/FileProvider/Widget extensions. A nested extension signed without
          # its matching entitlement can make iOS kill the container app at launch,
          # so the public unsigned IPA keeps the main app only. The app code now
          # falls back to private in-app storage when App Groups are unavailable.
          rm -rf "$APP_PATH/PlugIns"

          mkdir -p Payload
          /usr/bin/ditto "$APP_PATH" "Payload/${APP_NAME}.app"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload "${APP_NAME}-Arabic-unsigned.ipa"

          echo "✅ IPA created: $(pwd)/${APP_NAME}-Arabic-unsigned.ipa"
          /usr/bin/unzip -l "${APP_NAME}-Arabic-unsigned.ipa" | sed -n '1,120p'
          ls -lh *.ipa

      - name: ⬆️ Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenMinis-Arabic-unsigned-IPA
          path: src/ios/*.ipa
          retention-days: 30
